<!doctype html>
<html>
 <head>
 <meta charset="UTF-8">
 <style>
 table { border-collapse: collapse; }
 th, td { border: thin solid grey; padding: 4pt 12pt; text-align: right; }
 </style>
 </head>
 <body>
 <table>
 <thead>
 <tr><th>Число</th><th>Число<sup>2</sup></th><th>Число<sup>3</sup></th></tr>
 </thead>
 <tbody id="output">
 </tbody>
 </table>
<script>
const output = document.getElementById('output');
let s = ''; // 2
for (let i = 1; i < 11; i++) // 3
 s = s + '<tr>' + // 4
 '<td>' + i + '</td>' +
 '<td>' + i ** 2 + '</td>' +
 '<td>' + i ** 3 + '</td>' +
 '</tr>';
output.innerHTML = s; // 5
</script>
 </body>
</html>
