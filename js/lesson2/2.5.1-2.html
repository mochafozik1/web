<!doctype html>
<html>
 <head>
 <meta charset="UTF-8">
 <style>
 table { border-collapse: collapse; }
 th, td { border: thin solid grey; padding: 4pt 12pt; text-align: right; }
 </style>
 </head>
 <body>
<script>
document.write('<table>');
document.write('<tr>');
document.write('<th>Число</th>');
document.write('<th>Число<sup>2</sup></th>');
document.write('<th>Число<sup>3</sup></th>');
document.write('<th>Число<sup>4</sup></th>');
document.write('</tr>');
for (let i = 1; i < 11; i++) {
 document.write('<tr>');
 document.write('<td>' + i + '</td>');
 document.write('<td>' + i ** 2 + '</td>');
 document.write('<td>' + i ** 3 + '</td>');
 document.write('<td>' + i ** 4 + '</td>');
 document.write('</tr>');
}
document.write('</table>');
</script>
 </body>
</html>
